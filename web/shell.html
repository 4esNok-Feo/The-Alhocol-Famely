<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Катьме: Смена — аркада о смене в магазине у дома</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Расставь товар, отбей очередь и доживи до конца смены. Проверяй паспорта и не пускай пустые полки.">
<meta name="theme-color" content="#3f7a45">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<!--
  Браузерная оболочка для Яндекс Игр.

  Отличия от index.html (рабочей страницы проекта):
   • подключает /sdk.js — SDK, который отдаёт сама платформа;
   • останавливает игру на паузу, когда платформа просит (реклама, вкладка);
   • сообщает платформе о старте/остановке игрового процесса.

  Никаких сторонних библиотек и CDN: только модули самого проекта.
-->
<style>
  /* Шрифты лежат в архиве рядом с игрой и лицензируются вместе с ней
     (assets/fonts/LICENSE.txt). Без @font-face браузер рисовал бы кириллицу
     системным шрифтом, и надписи на канвасе выглядели бы по-разному. */
  @font-face {
    font-family: "DejaVu Sans";
    src: url("assets/fonts/DejaVuSans.ttf") format("truetype");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "DejaVu Sans";
    src: url("assets/fonts/DejaVuSans-Bold.ttf") format("truetype");
    font-weight: 700 900; font-style: normal; font-display: swap;
  }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #161320; overflow: hidden; }
  body { font-family: "DejaVu Sans", "Segoe UI", Roboto, Arial, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
    color: #f6f1e9; background: radial-gradient(circle at 50% 30%, #33283c, #14111c 70%);
  }
  #boot h1 { font-size: clamp(22px, 5vw, 40px); margin: 0; }
  #boot p { margin: 0; max-width: 44ch; color: #c7beb6; line-height: 1.5; }
  #boot .bar { width: min(320px, 70vw); height: 8px; border-radius: 6px; background: #3a3244; overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 8%; background: linear-gradient(90deg,#3f7a45,#f7c948); transition: width .3s; }
  #crash { position: fixed; inset: 0; display: none; padding: 24px; overflow: auto;
           background: #2a1116; color: #ffd7d7; font-size: 14px; z-index: 30; }
  #crash pre { white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<!-- SDK платформы: файл присутствует только на хостинге Яндекс Игр. -->
<script src="/sdk.js"></script>

<canvas id="game" aria-label="Игровое поле: магазин у дома"></canvas>
<div id="boot">
  <h1>Катьме: Смена</h1>
  <p>Магазин «ВИНОГРАД» открывается. Расставьте товар, отбейте очередь и проверьте паспорта.</p>
  <div class="bar"><i id="bootBar"></i></div>
  <p id="bootHint" style="font-size:13px;color:#9d938c">Загрузка…</p>
</div>
<div id="crash"><h2>Игра не запустилась</h2><p id="crashMsg"></p><pre id="crashStack"></pre></div>
<noscript>Для игры нужен браузер с включённым JavaScript.</noscript>

<script type="module">
  const boot = document.getElementById('boot');
  const bootBar = document.getElementById('bootBar');
  const bootHint = document.getElementById('bootHint');
  const setProgress = (pct, text) => {
    bootBar.style.width = `${Math.max(8, Math.min(100, pct))}%`;
    if (text) bootHint.textContent = text;
  };
  window.__KATME__ = { version: '1.0.1', ready: false, lastError: null, shell: 'yandex' };

  const showCrash = (err) => {
    document.getElementById('crash').style.display = 'block';
    document.getElementById('crashMsg').textContent = String(err?.message ?? err);
    document.getElementById('crashStack').textContent = String(err?.stack ?? '');
    window.__KATME__.lastError = String(err?.message ?? err);
  };

  try {
    setProgress(20, 'Проверяем платформу…');
    const [{ Game }, { platform }] = await Promise.all([
      import('./src/game.js'),
      import('./web/platform.js'),
    ]);
    const game = new Game(document.getElementById('game'), platform);
    window.__KATME__.game = game;
    window.__KATME__.platform = platform;

    // Пауза от платформы: реклама, сворачивание вкладки, смена аккаунта.
    platform.onPause(() => { game.onPlatformPause(); });
    platform.onResume(() => { game.onPlatformResume(); });

    await game.boot();
    setProgress(100, 'Открываем двери!');
    window.__KATME__.debugInfo = () => ({ ...platform.debugInfo(), state: game.state });
    setTimeout(() => boot.classList.add('hidden'), 240);
    // Страховка от «вечной загрузки»: если через 20 секунд игра не в смене и
    // не в меню — показываем сообщение, но не выбрасываем игрока.
    setTimeout(() => {
      if (!window.__KATME__.ready) setProgress(100, 'Загрузка затянулась — попробуйте обновить страницу');
    }, 20000);
  } catch (err) {
    console.error(err);
    showCrash(err);
  }
</script>
</body>
</html>
